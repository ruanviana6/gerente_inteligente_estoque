name: Testes Python
on:
  push:
  pull_request:
jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Dependencias
        run: python -m pip install -r requirements.txt
      - name: Testes
        run: python -m pytest
      - name: Lint principal
        run: ruff check --select E4,E7,E9,F .
