name: Testes Python
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Dependencias
        run: python -m pip install -r requirements.txt
      - name: Testes
        run: python -m pytest -ra --junitxml=resultado-testes.xml
      - name: Lint principal
        run: ruff check .
      - name: Verificar dependências instaladas
        run: python -m pip check
      - name: Registrar versões efetivamente testadas
        if: always()
        run: python -m pip freeze > dependencias-testadas.txt
      - name: Guardar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-python-${{ matrix.python }}
          path: |
            resultado-testes.xml
            dependencias-testadas.txt

