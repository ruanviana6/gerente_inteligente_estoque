# Entrada única autenticada. A plataforma define endereço e porta no deploy.
[server]
headless = true
maxUploadSize = 10
enableXsrfProtection = true
enableCORS = true

[client]
showErrorDetails = "none"
# Mantém downloads nos botões que reautorizam a operação; dados já exibidos
# continuam acessíveis ao próprio usuário, isto não é uma barreira de segurança.
disableDataExport = true

[browser]
gatherUsageStats = false

# Tema Flatter: fontes do próprio sistema, sem downloads ou serviços externos.
[theme]
base = "light"
primaryColor = "#9C4438"
backgroundColor = "#FBF8F6"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#2D1C25"
font = "sans-serif"
headingFont = "sans-serif"
headingFontSizes = ["2rem", "1.5rem", "1.25rem", "1.1rem", "1rem", "0.875rem"]
headingFontWeights = [650, 600, 600, 600, 600, 600]
baseRadius = "0.65rem"
buttonRadius = "0.65rem"
borderColor = "#8A727A"
showWidgetBorder = true
showSidebarBorder = true
linkColor = "#8B332E"
linkUnderline = true
grayTextColor = "#66575F"
redColor = "#AA2737"
redBackgroundColor = "#FCE9E6"
redTextColor = "#AA2737"
yellowColor = "#875900"
yellowBackgroundColor = "#FAF0DE"
yellowTextColor = "#875900"
greenColor = "#1D705A"
greenBackgroundColor = "#E7F3EC"
greenTextColor = "#1D705A"
blueColor = "#69417C"
blueBackgroundColor = "#F0E9F5"
blueTextColor = "#69417C"
chartCategoricalColors = ["#9C4438", "#69417C", "#1D705A", "#875900", "#A35B76", "#77584F"]
dataframeBorderColor = "#E7DAD8"
dataframeHeaderBackgroundColor = "#F4ECE8"
dataframeHeaderTextColor = "#2D1C25"
paddingTop = "1.5rem"
paddingBottom = "2rem"

[theme.sidebar]
backgroundColor = "#F4ECE8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#2D1C25"
borderColor = "#8A727A"
headingFontSizes = ["1.4rem", "1.2rem", "1.1rem", "1rem", "0.95rem", "0.875rem"]
paddingTop = "1.25rem"
